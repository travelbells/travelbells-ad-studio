<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=Playfair+Display:wght@700;800;900&amp;family=Outfit:wght@600;700;800;900&amp;display=swap');
      .light-headline { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 34px; color: #002B49; line-height: 1.25; text-align: left; }
      .light-subhead { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; color: #475569; line-height: 1.35; text-align: left; }
      .bullet-text-style { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; color: #1E293B; line-height: 1.35; text-align: left; }
    </style>
    <clipPath id="photoClip">
      <rect width="430" height="645" rx="24"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#F8FAFC"/>
  
  <!-- Outer Decorative Border -->
  <rect x="15" y="15" width="1050" height="1890" rx="24" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- TOP HEADER SECTION (Logo Left, RCIC Badge Right) -->
  <g transform="translate(30, 25)">
    <!-- Logo Card -->
    <rect width="250" height="85" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    
    <text x="125" y="52" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="22" fill="#002B49" text-anchor="middle">TravelBells</text>
    

    <!-- RCIC License Pill Badge (Top Right) -->
    <g transform="translate(680, 15)">
      <rect width="340" height="48" rx="24" fill="#FFFFFF" stroke="#002B49" stroke-width="2" filter="url(#shadow)"/>
      <text x="170" y="31" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#002B49" text-anchor="middle">🇨🇦 Licensed RCIC Member</text>
    </g>
  </g>

  <!-- 2-COLUMN MAIN CONTENT AREA (Y=135 to 790) -->
  <!-- LEFT COLUMN: Photo Card -->
  <g transform="translate(30, 135)" filter="url(#shadow)">
    <rect width="430" height="645" rx="24" fill="#FFFFFF" stroke="#C8102E" stroke-width="2.5"/>
    <image href="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=800&auto=format&fit=crop&q=80" width="430" height="645" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  </g>

  <!-- RIGHT COLUMN: Category Pill, Headline, Subtitle, Bullets Card -->
  <g transform="translate(480, 135)">
    
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="38" rx="19" fill="#C8102E" filter="url(#shadow)"/>
      <text x="160" y="24" font-family="'Montserrat', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">STUDY VISA UPGRADE</text>
    </g>

    <!-- Headline -->
    <g transform="translate(0, 50)">
      <foreignObject width="570" height="110">
        <div xmlns="http://www.w3.org/1999/xhtml" class="light-headline">
          <span style="color: #C8102E; font-weight: 900;">Work Permit</span> Ending? Don't Exit, <strong>Upgrade</strong>
        </div>
      </foreignObject>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 165)">
      <foreignObject width="570" height="60">
        <div xmlns="http://www.w3.org/1999/xhtml" class="light-subhead">
          Your time in Canada doesn't have to stop here
        </div>
      </foreignObject>
    </g>

    <!-- Bullets Card -->
    <g transform="translate(0, 235)" filter="url(#shadow)">
      <rect width="570" height="410" rx="18" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="410" fill="#C8102E" rx="4"/>

      <!-- Bullet 1 -->
      <g transform="translate(25, 20)">
        <circle cx="16" cy="16" r="14" fill="#C8102E"/>
        <path d="M11 16 L15 20 L22 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <foreignObject x="42" y="0" width="485" height="75">
          <div xmlns="http://www.w3.org/1999/xhtml" class="bullet-text-style">
            Stay in Canada legally while studying
          </div>
        </foreignObject>
      </g>

      <!-- Bullet 2 -->
      <g transform="translate(25, 110)">
        <circle cx="16" cy="16" r="14" fill="#C8102E"/>
        <path d="M11 16 L15 20 L22 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <foreignObject x="42" y="0" width="485" height="75">
          <div xmlns="http://www.w3.org/1999/xhtml" class="bullet-text-style">
            Upgrade your skills with in-demand programs
          </div>
        </foreignObject>
      </g>

      <!-- Bullet 3 -->
      <g transform="translate(25, 200)">
        <circle cx="16" cy="16" r="14" fill="#C8102E"/>
        <path d="M11 16 L15 20 L22 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <foreignObject x="42" y="0" width="485" height="75">
          <div xmlns="http://www.w3.org/1999/xhtml" class="bullet-text-style">
            Open new pathways toward PR
          </div>
        </foreignObject>
      </g>

      <!-- Bullet 4 -->
      <g transform="translate(25, 290)">
        <circle cx="16" cy="16" r="14" fill="#C8102E"/>
        <path d="M11 16 L15 20 L22 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <foreignObject x="42" y="0" width="485" height="75">
          <div xmlns="http://www.w3.org/1999/xhtml" class="bullet-text-style">
            Complete support from profile to approval
          </div>
        </foreignObject>
      </g>
    </g>
  </g>

  <!-- CTA BANNER BAR (Y=795) -->
  <g transform="translate(30, 795)" filter="url(#shadow)">
    <rect width="1020" height="64" rx="16" fill="#C8102E"/>
    <text x="510" y="41" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">👉 BOOK YOUR OFFICIAL CONSULTATION TODAY</text>
  </g>

  
  <!-- FOOTER SECTION (Y=875 to 1080) -->
  <g transform="translate(0, 875)">
    <rect width="1080" height="205" fill="#002B49"/>
    <rect width="1080" height="6" fill="#C8102E"/>
    <foreignObject x="30" y="20" width="1020" height="165">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Montserrat', sans-serif; color: #FFFFFF; font-size: 15px; font-weight: 700; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; align-items: center;">
        <div style="background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 8px; text-align: center;">🌐 www.travelbellsimmigration.com</div>
        <div style="background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 8px; text-align: center;">📧 info@travelbellsimmigration.com</div>
        <div style="background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 8px; text-align: center;">📞 +1 (647) 890-1476</div>
        <div style="padding: 10px 16px; text-align: center; color: #94A3B8;">📍 Ontario, Canada • Licensed CICC Member</div>
      </div>
    </foreignObject>
  </g>
</svg>